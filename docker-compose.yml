services:
  api:
    build: ./api
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/umarell.db
    volumes:
      - umarell_db:/app/data

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:8100
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

volumes:
  umarell_db:
